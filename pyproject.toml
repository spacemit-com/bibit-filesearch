[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibit-filesearch"
version = "0.1.34"
description = "Local semantic file search service (watcher/indexer/scanner/retriever/nl_parser/settings)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "PyYAML>=6.0",
    "jieba>=0.42",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "rank-bm25>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bibit-filesearch = "bibit_filesearch.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bibit_filesearch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
